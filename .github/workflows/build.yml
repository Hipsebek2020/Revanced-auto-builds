name: Build YouTube anndea (Final Optimized)

on:
  schedule:
    - cron: '0 * * * *' # Sprawdza co godzinę
  workflow_dispatch:      # Pozwala na ręczne uruchomienie w dowolnym momencie

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Zabezpieczenie przed zawieszeniem procesu
    permissions:
      contents: write     # Wymagane do publikacji pliku APK w Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pobieranie danych o łatkach anndea..."
          # Pobieramy info o ostatnim wydaniu anndea
          REMOTE_JSON=$(curl -sL https://api.github.com/repos/anndea/revanced-patches/releases | jq '.[0]')
          REMOTE_TAG=$(echo "$REMOTE_JSON" | jq -r '.tag_name // "null"')
          IS_PRE=$(echo "$REMOTE_JSON" | jq -r '.prerelease // false')

          echo "Pobieranie danych o Twoim repozytorium..."
          # Pobieramy info o Twoim ostatnim wydaniu (z autoryzacją)
          LOCAL_JSON=$(curl -sL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/releases)
          
          # Bezpieczne wyciąganie tagu lokalnego
          LOCAL_TAG=$(echo "$LOCAL_JSON" | jq -r 'if type=="array" and length>0 then .[0].tag_name else "none" end')

          echo "Wersja anndea: $REMOTE_TAG"
          echo "Twoja wersja:  $LOCAL_TAG"

          # Warunek: Czy budować?
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "Znaleziono aktualizację. Przygotowuję build..."
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
            echo "IS_PRE=$IS_PRE" >> $GITHUB_ENV
            
            # Przygotowanie changeloga
            CHANGELOG=$(echo "$REMOTE_JSON" | jq -r '.body // "Brak opisu zmian."')
            echo "ANN_CHANGELOG<<EOF" >> $GITHUB_ENV
            echo "$CHANGELOG" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "Brak nowych łatek lub błąd połączenia. Przerywam."
            echo "should_build=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build YouTube APK
        if: env.should_build == 'true'
        run: |
          # Budowanie z wykluczeniem łatki 'theme' (Material You)
          npx revanced-creator build \
            --repo anndea/revanced-patches \
            --app com.google.android.youtube \
            --exclude "theme"

      - name: Create Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: ${{ env.VERSION_TAG }}
          name: YouTube anndea ${{ env.VERSION_TAG }}
          prerelease: ${{ env.IS_PRE == 'true' }}
          body: |
            ### 🤖 Automatyczny Build
            **Wersja łatek:** `${{ env.VERSION_TAG }}`
            
            ---
            ### 📝 Changelog od anndea:
            ${{ env.ANN_CHANGELOG }}
            
            ---
            *Informacja: Zbudowano bez łatki Material You (standardowe kolory).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
