name: Build YouTube & Piko X (Twitter)
on:
  schedule:
    - cron: '0 */2 * * *'  # Co 2 godziny zamiast co godzinę (oszczędność limitów)
  workflow_dispatch:

jobs:
  # --- JOB 1: YOUTUBE ---
  build-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for YouTube Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pobierz najnowszy tag z anndea
          REMOTE_TAG=$(gh release list --repo anndea/revanced-patches --limit 1 | awk '{print $3}' || echo "null")
          
          # Pobierz najnowszy lokalny tag YouTube
          LOCAL_TAG=$(gh release list --limit 20 | grep -E "^YouTube-v" | head -n 1 | awk '{print $3}' | sed 's/YouTube-v//' || echo "none")
          
          echo "Remote patches version: $REMOTE_TAG"
          echo "Local YouTube version: $LOCAL_TAG"
          
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
            echo "✅ New version detected - will build"
          else
            echo "should_build=false" >> $GITHUB_ENV
            echo "ℹ️ No update needed"
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build YouTube
        if: env.should_build == 'true'
        run: |
          # Usuń stare buildy
          rm -rf github-builds
          
          # Zbuduj YouTube z wykluczeniem motywu
          npx revanced-creator build \
            --repo anndea/revanced-patches \
            --app com.google.android.youtube \
            --exclude "theme"

      - name: Create YouTube Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: YouTube-v${{ env.VERSION_TAG }}
          name: YouTube anndea v${{ env.VERSION_TAG }}
          body: |
            📱 YouTube ReVanced - automatyczny build
            🔧 Patches version: ${{ env.VERSION_TAG }}
            📦 Zbudowano przez GitHub Actions
            
            Wykluczono łatkę: theme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2: PIKO X (TWITTER) ---
  build-piko-x:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Piko X Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pobierz najnowszy tag z anndea
          REMOTE_TAG=$(gh release list --repo anndea/revanced-patches --limit 1 | awk '{print $3}' || echo "null")
          
          # Pobierz najnowszy lokalny tag PikoX
          LOCAL_TAG=$(gh release list --limit 20 | grep -E "^PikoX-v" | head -n 1 | awk '{print $3}' | sed 's/PikoX-v//' || echo "none")
          
          echo "Remote patches version: $REMOTE_TAG"
          echo "Local PikoX version: $LOCAL_TAG"
          
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
            echo "✅ New version detected - will build"
          else
            echo "should_build=false" >> $GITHUB_ENV
            echo "ℹ️ No update needed"
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Piko X
        if: env.should_build == 'true'
        run: |
          # Usuń stare buildy
          rm -rf github-builds
          
          # Dla Twittera (Piko X) wykluczamy 'custom-branding', aby zachować oryginalne logo X
          npx revanced-creator build \
            --repo anndea/revanced-patches \
            --app com.twitter.android \
            --exclude "custom-branding"

      - name: Create Piko X Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: PikoX-v${{ env.VERSION_TAG }}
          name: Piko X (Twitter) anndea v${{ env.VERSION_TAG }}
          body: |
            📱 Piko X (Twitter) ReVanced - automatyczny build
            🔧 Patches version: ${{ env.VERSION_TAG }}
            📦 Zbudowano przez GitHub Actions
            
            Wykluczono łatkę: custom-branding (oryginalne logo X)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
