name: Build YouTube & Piko X (Twitter)
on:
  schedule:
    - cron: '0 */2 * * *'  # Sprawdzanie co 2 godziny
  workflow_dispatch:

jobs:
  # --- JOB 1: YOUTUBE ---
  build-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for YouTube Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pobieramy czysty tag od anndea (np. 2.221.1)
          REMOTE_TAG=$(gh release list --repo anndea/revanced-patches --limit 1 | awk '{print $3}' || echo "null")
          
          # Pobieramy Twój tag i usuwamy prefix "YouTube-" aby zostały same cyfry
          LOCAL_TAG=$(gh release list --limit 20 | grep "YouTube-" | head -n 1 | awk '{print $3}' | sed 's/YouTube-//' || echo "none")
          
          echo "Wersja u anndea: $REMOTE_TAG"
          echo "Twoja wersja: $LOCAL_TAG"
          
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
          else
            echo "should_build=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build YouTube
        if: env.should_build == 'true'
        run: |
          rm -rf github-builds
          npx revanced-creator build \
            --repo anndea/revanced-patches \
            --app com.google.android.youtube \
            --exclude "theme"

      - name: Create YouTube Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: YouTube-${{ env.VERSION_TAG }}
          name: YouTube anndea ${{ env.VERSION_TAG }}
          body: |
            📱 YouTube ReVanced - automatyczny build
            🔧 Patches version: ${{ env.VERSION_TAG }}
            📦 Wykluczono łatkę: theme
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2: PIKO X (TWITTER) ---
  build-piko-x:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Piko X Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE_TAG=$(gh release list --repo anndea/revanced-patches --limit 1 | awk '{print $3}' || echo "null")
          
          # Pobieramy Twój tag i usuwamy prefix "PikoX-"
          LOCAL_TAG=$(gh release list --limit 20 | grep "PikoX-" | head -n 1 | awk '{print $3}' | sed 's/PikoX-//' || echo "none")
          
          echo "Wersja u anndea: $REMOTE_TAG"
          echo "Twoja wersja: $LOCAL_TAG"
          
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
          else
            echo "should_build=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Piko X
        if: env.should_build == 'true'
        run: |
          rm -rf github-builds
          npx revanced-creator build \
            --repo anndea/revanced-patches \
            --app com.twitter.android \
            --exclude "custom-branding"

      - name: Create Piko X Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: PikoX-${{ env.VERSION_TAG }}
          name: Piko X (Twitter) anndea ${{ env.VERSION_TAG }}
          body: |
            📱 Piko X (Twitter) ReVanced - automatyczny build
            🔧 Patches version: ${{ env.VERSION_TAG }}
            📦 Wykluczono łatkę: custom-branding (zachowano logo X)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
