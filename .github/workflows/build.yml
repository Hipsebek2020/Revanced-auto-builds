name: Build YouTube & Piko X (Twitter)
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  # --- JOB 1: YOUTUBE ---
  build-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for YouTube Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE_TAG=$(gh release list --repo anndea/revanced-patches --limit 1 | awk '{print $3}' || echo "null")
          LOCAL_TAG=$(gh release list --limit 10 | grep "YouTube-v" | head -n 1 | awk '{print $3}' | sed 's/YouTube-//' || echo "none")
          
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
          else
            echo "should_build=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build YouTube
        if: env.should_build == 'true'
        run: npx revanced-creator build --repo anndea/revanced-patches --app com.google.android.youtube --exclude "theme"

      - name: Create YouTube Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: YouTube-${{ env.VERSION_TAG }}
          name: YouTube anndea ${{ env.VERSION_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2: PIKO X (TWITTER) ---
  build-piko-x:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Piko X Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE_TAG=$(gh release list --repo anndea/revanced-patches --limit 1 | awk '{print $3}' || echo "null")
          LOCAL_TAG=$(gh release list --limit 10 | grep "PikoX-v" | head -n 1 | awk '{print $3}' | sed 's/PikoX-//' || echo "none")
          
          if [ "$REMOTE_TAG" != "null" ] && [ "$REMOTE_TAG" != "$LOCAL_TAG" ]; then
            echo "should_build=true" >> $GITHUB_ENV
            echo "VERSION_TAG=$REMOTE_TAG" >> $GITHUB_ENV
          else
            echo "should_build=false" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        if: env.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Piko X
        if: env.should_build == 'true'
        run: |
          # Dla Twittera (Piko X) wykluczamy 'custom-branding', aby zachować oryginalne logo X
          npx revanced-creator build \
            --repo anndea/revanced-patches \
            --app com.twitter.android \
            --exclude "custom-branding"

      - name: Create Piko X Release
        if: env.should_build == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: github-builds/*.apk
          tag_name: PikoX-${{ env.VERSION_TAG }}
          name: Piko X (Twitter) anndea ${{ env.VERSION_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
